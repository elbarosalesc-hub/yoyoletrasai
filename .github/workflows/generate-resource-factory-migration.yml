name: Generate resource factory migration

on:
  push:
    branches:
      - fix/resource-factory-schema

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resource-factory-schema
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover Supabase CLI
        run: |
          npx --yes supabase@latest --help
          npx --yes supabase@latest migration new --help
      - name: Generate migration file
        run: npx --yes supabase@latest migration new restore_resource_factory_schema
      - name: Commit generated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations
          git commit -m "Generate resource factory migration with Supabase CLI"
          git push origin HEAD:fix/resource-factory-schema
