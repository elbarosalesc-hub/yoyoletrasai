name: Deploy Cloudflare production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Escribe DEPLOY para confirmar publicación en producción"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_production == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_DEPLOY_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      RUNTIME_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUNTIME_CRON_SECRET: ${{ secrets.CRON_SECRET }}
      RUNTIME_YOYO_OWNER_EMAIL: ${{ secrets.YOYO_OWNER_EMAIL }}
      RUNTIME_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.YOYO_RUNTIME_CLOUDFLARE_ACCOUNT_ID }}
      RUNTIME_CLOUDFLARE_API_TOKEN: ${{ secrets.YOYO_RUNTIME_CLOUDFLARE_API_TOKEN }}
      RUNTIME_YOYO_AI_GATEWAY_URL: ${{ secrets.YOYO_AI_GATEWAY_URL }}
      RUNTIME_YOYO_AI_MODEL_ESSENTIAL: ${{ vars.YOYO_AI_MODEL_ESSENTIAL }}
      RUNTIME_YOYO_AI_MODEL_ADVANCED: ${{ vars.YOYO_AI_MODEL_ADVANCED }}
      RUNTIME_YOYO_AI_MODEL_INSTITUTION: ${{ vars.YOYO_AI_MODEL_INSTITUTION }}
      RUNTIME_YOYO_AI_MODEL_OWNER: ${{ vars.YOYO_AI_MODEL_OWNER }}
      RUNTIME_YOYO_BILLING_PROVIDER: ${{ vars.YOYO_BILLING_PROVIDER }}
      RUNTIME_YOYO_BILLING_CHECKOUT_URL: ${{ secrets.YOYO_BILLING_CHECKOUT_URL }}
      RUNTIME_YOYO_PRODUCTION_URL: ${{ vars.YOYO_PRODUCTION_URL }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY RUNTIME_SUPABASE_SERVICE_ROLE_KEY RUNTIME_CRON_SECRET RUNTIME_YOYO_OWNER_EMAIL RUNTIME_CLOUDFLARE_ACCOUNT_ID RUNTIME_CLOUDFLARE_API_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Falta configurar $key en el environment production de GitHub."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Build Next.js
        run: npm run build

      - name: Build Cloudflare Worker
        run: npm run build:vinext --workspace=web

      - name: Verify Worker output
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/web/dist/client
          test -f apps/web/dist/server/wrangler.json

      - name: Create ephemeral runtime secrets file
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const mapping = {
            NEXT_PUBLIC_SUPABASE_URL: 'NEXT_PUBLIC_SUPABASE_URL',
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
            SUPABASE_SERVICE_ROLE_KEY: 'RUNTIME_SUPABASE_SERVICE_ROLE_KEY',
            CRON_SECRET: 'RUNTIME_CRON_SECRET',
            YOYO_OWNER_EMAIL: 'RUNTIME_YOYO_OWNER_EMAIL',
            CLOUDFLARE_ACCOUNT_ID: 'RUNTIME_CLOUDFLARE_ACCOUNT_ID',
            CLOUDFLARE_API_TOKEN: 'RUNTIME_CLOUDFLARE_API_TOKEN',
            YOYO_AI_GATEWAY_URL: 'RUNTIME_YOYO_AI_GATEWAY_URL',
            YOYO_AI_MODEL_ESSENTIAL: 'RUNTIME_YOYO_AI_MODEL_ESSENTIAL',
            YOYO_AI_MODEL_ADVANCED: 'RUNTIME_YOYO_AI_MODEL_ADVANCED',
            YOYO_AI_MODEL_INSTITUTION: 'RUNTIME_YOYO_AI_MODEL_INSTITUTION',
            YOYO_AI_MODEL_OWNER: 'RUNTIME_YOYO_AI_MODEL_OWNER',
            YOYO_BILLING_PROVIDER: 'RUNTIME_YOYO_BILLING_PROVIDER',
            YOYO_BILLING_CHECKOUT_URL: 'RUNTIME_YOYO_BILLING_CHECKOUT_URL',
            YOYO_PRODUCTION_URL: 'RUNTIME_YOYO_PRODUCTION_URL',
          }
          const lines = []
          for (const [target, source] of Object.entries(mapping)) {
            const value = process.env[source]
            if (value) lines.push(`${target}=${JSON.stringify(value)}`)
          }
          fs.writeFileSync('/tmp/yoyo-production.env', `${lines.join('\n')}\n`, { mode: 0o600 })
          NODE

      - name: Deploy validated Worker
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/yoyo-production.env' EXIT
          npx wrangler deploy --config dist/server/wrangler.json --secrets-file /tmp/yoyo-production.env

      - name: Deployment summary
        if: success()
        run: |
          echo "## YoYoLetrasAI · Cloudflare production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next.js build: validado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare Worker build: validado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publicación: completada por workflow manual protegido" >> "$GITHUB_STEP_SUMMARY"
