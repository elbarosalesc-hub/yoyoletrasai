name: Permanent YoYo Domain - Manual Safety Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Permanent domain protection
        shell: bash
        run: |
          echo "El dominio permanente no se modifica automáticamente."
          echo "Toda reasignación exige validación completa, salud de Supabase y acción explícita de release."
