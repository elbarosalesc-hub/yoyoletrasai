name: Promote YoYoLetrasAI 3.6 Production

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: "URL del preview Vercel 3.6 validado"
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_Wq1pPeDlHDUfKwJNyH4ZSLFD
      VERCEL_PROJECT_ID: prj_90GNn7Y95ZZIYAJEyOoJCyi6NO0p
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN || secrets.VERCEL_DEPLOY_TOKEN || vars.VERCEL_TOKEN || vars.VERCEL_ACCESS_TOKEN || vars.VERCEL_DEPLOY_TOKEN }}
      PREVIEW_URL: ${{ inputs.preview_url }}
    steps:
      - name: Require Vercel credential
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::No existe una credencial Vercel utilizable en el entorno Production."
            exit 2
          fi

      - name: Validate preview URL
        shell: bash
        run: |
          case "$PREVIEW_URL" in
            https://*.vercel.app) ;;
            *) echo "::error::preview_url debe ser una URL https://*.vercel.app"; exit 3 ;;
          esac

      - name: Verify preview health before promotion
        shell: bash
        run: |
          body="$(curl --fail --silent --show-error "$PREVIEW_URL/api/health")"
          printf '%s\n' "$body"
          printf '%s' "$body" | grep -q '"version":"3.6.0"'
          printf '%s' "$body" | grep -q '"application":"operational"'
          printf '%s' "$body" | grep -q '"resourcesApi":"operational"'
          if printf '%s' "$body" | grep -q '"probe"'; then
            echo "::error::El preview contiene marcador probe; promocion cancelada."
            exit 4
          fi

      - name: Verify resources before promotion
        shell: bash
        run: |
          resources="$(curl --fail --silent --show-error "$PREVIEW_URL/api/resources")"
          test -n "$resources"

      - name: Install Vercel CLI
        run: npm install --global vercel@50.1.6

      - name: Promote exact preview artifact
        shell: bash
        run: vercel promote "$PREVIEW_URL" --yes --token="$VERCEL_TOKEN"

      - name: Verify public production
        shell: bash
        run: |
          body="$(curl --fail --silent --show-error https://yoyoletrasai.vercel.app/api/health)"
          printf '%s\n' "$body"
          printf '%s' "$body" | grep -q '"version":"3.6.0"'
          printf '%s' "$body" | grep -q '"application":"operational"'
          printf '%s' "$body" | grep -q '"resourcesApi":"operational"'
          if printf '%s' "$body" | grep -q '"probe"'; then
            echo "::error::Produccion contiene marcador probe."
            exit 5
          fi
