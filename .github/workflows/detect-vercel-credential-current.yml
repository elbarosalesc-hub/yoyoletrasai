name: Detect Vercel credential current

on:
  push:
    branches:
      - agent/publish-v3-6-vite

permissions:
  contents: read

jobs:
  repository-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Detect repository credential
        env:
          CREDENTIAL: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN || secrets.VERCEL_DEPLOY_TOKEN || vars.VERCEL_TOKEN || vars.VERCEL_ACCESS_TOKEN || vars.VERCEL_DEPLOY_TOKEN }}
        run: |
          if [ -n "${CREDENTIAL:-}" ]; then
            echo "credential_available=true"
          else
            echo "credential_available=false"
          fi

  environment-scope:
    strategy:
      fail-fast: false
      matrix:
        environment:
          - Production
          - Production – yoyoletrasai-web
          - Production – yoyoletrasai-1b2m
          - Preview – yoyoletrasai-web
          - Preview – yoyoletrasai-1b2m
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - name: Detect environment credential
        env:
          CREDENTIAL: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN || secrets.VERCEL_DEPLOY_TOKEN || vars.VERCEL_TOKEN || vars.VERCEL_ACCESS_TOKEN || vars.VERCEL_DEPLOY_TOKEN }}
        run: |
          echo "environment=${{ matrix.environment }}"
          if [ -n "${CREDENTIAL:-}" ]; then
            echo "credential_available=true"
          else
            echo "credential_available=false"
          fi
