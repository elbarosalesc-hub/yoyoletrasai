name: Deploy YoYoLetrasAI 3.6 Exact Preview

on:
  push:
    branches:
      - staging/v3.6.0-exact-20260814
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: VERCEL_TOKEN
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_Wq1pPeDlHDUfKwJNyH4ZSLFD
      VERCEL_PROJECT_ID: prj_90GNn7Y95ZZIYAJEyOoJCyi6NO0p
      VERCEL_SCOPE: elbarosalesc-pngs-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN || secrets.VERCEL_DEPLOY_TOKEN || vars.VERCEL_TOKEN || vars.VERCEL_ACCESS_TOKEN || vars.VERCEL_DEPLOY_TOKEN }}
    steps:
      - name: Checkout isolated staging branch
        uses: actions/checkout@v4

      - name: Safety guard - never production
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "staging/v3.6.0-exact-20260814"
          test "${GITHUB_REF_NAME}" != "main"
          echo "Staging-only guard active. No production promotion is permitted by this workflow." >> "$GITHUB_STEP_SUMMARY"

      - name: Reconstruct exact YoYoLetrasAI 3.6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app
          mkdir -p app
          count="$(find release -maxdepth 1 -name 'exact-v360.part.*' -type f | wc -l | tr -d ' ')"
          test "$count" = "12"
          test "$(wc -c < release/exact-v360.tail-12-16 | tr -d ' ')" = "100000"
          test "$(wc -c < release/exact-v360.tail-17-21 | tr -d ' ')" = "100000"
          test "$(wc -c < release/exact-v360.tail-22-26 | tr -d ' ')" = "98236"
          echo "8c19fc91b93501c8716cfafaf386db5c36a574f0b4ef7c577583f4ceb68514bb  release/exact-v360.tail-12-16" | sha256sum -c -
          echo "3bb9b719af4389f43086c242611a1a33c00833c4d55edfca54aec399fd708d64  release/exact-v360.tail-17-21" | sha256sum -c -
          echo "0c3ee365c6b3aa1c9f58d4b5bd608ec3229e192d76bc5b0cc4c45088a33dbd12  release/exact-v360.tail-22-26" | sha256sum -c -
          find release -maxdepth 1 -name 'exact-v360.part.*' -type f | sort | xargs cat > /tmp/yoyo360-exact.tar.xz.b64
          cat release/exact-v360.tail-12-16 release/exact-v360.tail-17-21 release/exact-v360.tail-22-26 >> /tmp/yoyo360-exact.tar.xz.b64
          test "$(wc -c < /tmp/yoyo360-exact.tar.xz.b64 | tr -d ' ')" = "538236"
          base64 --decode /tmp/yoyo360-exact.tar.xz.b64 > /tmp/yoyo360-exact.tar.xz
          echo "8906010a428e8b5a05254d6888cefa006bde216a874b018b79a13d96103a86a7  /tmp/yoyo360-exact.tar.xz" | sha256sum -c -
          xz -t /tmp/yoyo360-exact.tar.xz
          tar -xJf /tmp/yoyo360-exact.tar.xz -C app
          test "$(find app -type f | wc -l | tr -d ' ')" = "52"
          grep -Eq '"version"[[:space:]]*:[[:space:]]*"3\.6\.0"' app/package.json
          test -f app/src/features/ImmersiveGames.jsx
          test -f app/src/features/OwnerFactoryManager.jsx
          test -f app/src/features/YoyoAIStudio.jsx
          test -f app/src/features/SourceLab.jsx
          test -f app/src/features/ReadingPlan.jsx
          test -f app/src/modules.jsx
          test -f app/api/owner/factory.js
          test -f app/api/ai/generate.js
          test -f app/vercel.json
          grep -q 'THREE.WebGLRenderer' app/src/features/ImmersiveGames.jsx
          grep -q 'YOYO_MODULE_BLUEPRINTS' app/shared/yoyo-core.js
          echo "Exact 3.6 source checksum and 52-file package validated in isolated app directory." >> "$GITHUB_STEP_SUMMARY"

      - name: Require Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.1.6

      - name: Pull preview environment only
        working-directory: app
        run: |
          rm -rf .vercel
          vercel pull --yes --environment=preview --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build exact 3.6 preview artifact
        working-directory: app
        run: vercel build --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Deploy immutable preview only
        id: deploy
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### YoYoLetrasAI 3.6 isolated preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview only. Production, custom domain and aliases were not promoted or changed." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate preview APIs and app
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          health="$(curl --fail --silent --show-error "$url/api/health")"
          printf '%s\n' "$health"
          printf '%s' "$health" | grep -q '"status":"ok"'
          printf '%s' "$health" | grep -q '"version":"3.6.0"'
          resources="$(curl --fail --silent --show-error "$url/api/resources")"
          test -n "$resources"
          curl --fail --silent --show-error "$url/" > /tmp/root.html
          test -s /tmp/root.html
          grep -qi 'YoYo' /tmp/root.html
          echo "Preview 3.6 validated without production promotion." >> "$GITHUB_STEP_SUMMARY"
