name: Deploy YoYoLetrasAI 3.6 Exact Preview

on:
  push:
    branches:
      - staging/v3.6.0-exact-20260814

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: VERCEL_TOKEN
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_Wq1pPeDlHDUfKwJNyH4ZSLFD
      VERCEL_PROJECT_ID: prj_90GNn7Y95ZZIYAJEyOoJCyi6NO0p
      VERCEL_SCOPE: elbarosalesc-pngs-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN || secrets.VERCEL_DEPLOY_TOKEN || vars.VERCEL_TOKEN || vars.VERCEL_ACCESS_TOKEN || vars.VERCEL_DEPLOY_TOKEN }}
    steps:
      - name: Checkout staging carrier
        uses: actions/checkout@v4

      - name: Reconstruct exact 3.6 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          cat release/yoyo360.part.* > /tmp/yoyo360.tar.gz.b64
          base64 --decode /tmp/yoyo360.tar.gz.b64 > /tmp/yoyo360.tar.gz
          echo "d558a3ca97af279ac9f3c50bae9c6361da7eb97ca6e6700f1e8a893049d142f7  /tmp/yoyo360.tar.gz" | sha256sum -c -
          tar -xzf /tmp/yoyo360.tar.gz -C app
          test "$(find app -type f | wc -l | tr -d ' ')" = "52"
          grep -q '"version":"3.6.0"' app/package.json
          test -f app/src/features/ImmersiveGames.jsx
          test -f app/src/features/OwnerFactoryManager.jsx
          test -f app/api/owner/factory.js
          test -f app/api/ai/generate.js
          test -f app/vercel.json

      - name: Require Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.1.6

      - name: Pull preview environment only
        working-directory: app
        run: |
          rm -rf .vercel
          vercel pull --yes --environment=preview --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build exact 3.6 preview
        working-directory: app
        run: vercel build --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Deploy immutable preview only
        id: deploy
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### YoYoLetrasAI 3.6 exact preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview only. Production and custom domain were not promoted or changed." >> "$GITHUB_STEP_SUMMARY"
