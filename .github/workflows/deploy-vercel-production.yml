name: Deploy Vercel Production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-vercel-production.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_Wq1pPeDlHDUfKwJNyH4ZSLFD
  VERCEL_PROJECT_ID: prj_90GNn7Y95ZZIYAJEyOoJCyi6NO0p

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Vercel token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN is not configured in repository secrets."
            exit 2
          fi

      - name: Link current Vercel project
        run: |
          mkdir -p apps/web/.vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > apps/web/.vercel/project.json

      - name: Deploy Next.js application to production
        run: npx --yes vercel@latest deploy --prod --yes --cwd apps/web --token "${{ secrets.VERCEL_TOKEN }}"
