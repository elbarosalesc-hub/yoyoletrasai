name: Detect Vercel Credential

on:
  push:
    branches:
      - agent/publish-v3-6-vite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    strategy:
      fail-fast: false
      matrix:
        environment:
          - Production
          - "Production – yoyoletrasai-web"
          - "Production – yoyoletrasai-1b2m"
          - "Preview – yoyoletrasai-web"
          - "Preview – yoyoletrasai-1b2m"
          - github-pages
          - github-pages-review
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN || secrets.VERCEL_DEPLOY_TOKEN || vars.VERCEL_TOKEN || vars.VERCEL_ACCESS_TOKEN || vars.VERCEL_DEPLOY_TOKEN }}
    steps:
      - name: Check credential presence safely
        shell: bash
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "credential_available=true"
          else
            echo "credential_available=false"
          fi
