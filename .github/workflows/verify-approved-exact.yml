name: Verify approved exact source

on:
  push:
    branches:
      - recovery/approved-3.6-verification
    paths:
      - .github/workflows/verify-approved-exact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/approved-3.6-verification
          fetch-depth: 0
      - name: Verify exact approved 52-file manifest
