name: Audit YOYO IA Exclusive

on:
  push:
    branches:
      - agent/yoyo-ai-exclusive-3-6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exclusive engine architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f shared/yoyo-ai-engine.js
          test -f shared/yoyo-capability-benchmark.js
          test -f shared/owner-ai-config.js
          test -f shared/owner-platform-config.js
          test -f api/_yoyo-native-runtime.js
          test -f api/_yoyo-storage.js
          test -f api/ai/generate.js
          test -f api/_ai-access.js
          test -f api/_resource-factory.js
          test -f api/cron/innovation-scan.js
          test -f api/cron/capability-benchmark.js
          test -f api/cron/resource-factory.js
          grep -q "YOYO-IA-EDU-CL-001" shared/yoyo-ai-engine.js
          grep -q "provider-agnostic" shared/yoyo-ai-engine.js
          grep -q "qualityMultiplierTarget: 1.2" shared/yoyo-capability-benchmark.js
          grep -q "nativeInferenceRequiredForFullIndependence: true" shared/yoyo-capability-benchmark.js
          grep -q "YOYO Native Runtime" api/_yoyo-native-runtime.js
          grep -q "YOYO Storage" api/_yoyo-storage.js
          grep -q "OWNER_AI_ROLES" shared/owner-ai-config.js
          grep -q "buildOwnerAIProtocol" api/ai/generate.js
          grep -q "auditYoyoActivity" api/_resource-factory.js
          grep -q "capability-benchmark" vercel.json
          grep -q '30 6 1 1,7 \*' vercel.json
          grep -q "resource-factory" vercel.json
      - name: Verify owner login and persistent credential
        shell: bash
        run: |
          set -euo pipefail
          test -f api/owner/session.js
          test -f api/_runtime-credentials.js
          grep -q "plan_id.*propietaria" api/owner/session.js
          grep -q "model_tier.*owner" api/owner/session.js
          grep -q "platform_secret_store" api/_runtime-credentials.js
          grep -q "aes-256-gcm" api/_runtime-credentials.js
          grep -q "encrypted_owner_store" api/_runtime-credentials.js
          grep -q "saveGatewayCredential" api/owner/control.js
          grep -q "/api/owner/session" src/App.jsx
          grep -q "ownerSession?.owner === true" src/App.jsx
      - name: Verify all-module factory
        shell: bash
        run: |
          set -euo pipefail
          count="$(grep -c "id: '" shared/yoyo-core.js)"
          test "$count" -ge 19
          grep -q "nineteen_module_resource_factory" shared/yoyo-capability-benchmark.js
          grep -q "pickModules" api/_resource-factory.js
      - name: Verify owner master application
        shell: bash
        run: |
          set -euo pipefail
          test -f src/features/OwnerPlatformManager.jsx
          grep -q "singleControlSurface: true" shared/owner-platform-config.js
          grep -q "category-leading-educational-platform" shared/owner-platform-config.js
          grep -q "deployOnlyWhenReleaseReady: true" shared/owner-platform-config.js
          grep -q "productionAutoDeploy: false" shared/owner-platform-config.js
          grep -q "minimizeUnnecessaryDeployments: true" shared/owner-platform-config.js
      - name: Verify cache safety
        shell: bash
        run: |
          set -euo pipefail
          test -f src/platform-cache.js
          grep -q "stale-while-revalidate=86400" api/resources.js
          grep -q "If-None-Match" src/platform-cache.js
          grep -q "neverCacheOwnerSecrets: true" shared/owner-platform-config.js
          grep -q "neverCacheAuthTokens: true" shared/owner-platform-config.js
          grep -q "neverCacheOwnerEndpoints: true" shared/owner-platform-config.js
          grep -q "neverCacheAIRequests: true" shared/owner-platform-config.js
          grep -q "no-store" api/owner/profile.js
          grep -q "no-store" api/owner/control.js
          grep -q "no-store" api/owner/session.js
          grep -q "no-store" api/ai/generate.js
      - name: Verify safe publication defaults
        shell: bash
        run: |
          set -euo pipefail
          grep -q "autoPublish" api/owner/factory.js
          grep -q "status:shouldPublish?'published':'review'" api/_resource-factory.js
          grep -q "auto_publish_resources" api/owner/factory.js
          grep -q "productionAutoPromotion: false" shared/yoyo-capability-benchmark.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Build 3.6
        run: npm run build
      - name: Summary
        run: echo "YOYO owner login, encrypted persistent credential, exclusive AI architecture, safe cache, 19-module factory and release policy audited. No production, domain or alias change performed." >> "$GITHUB_STEP_SUMMARY"
