name: Vista funcional YOYO

on:
  push:
    branches:
      - agent/rebuild-reference-model-v3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: yoyo-functional-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch de revisión
        uses: actions/checkout@v4

      - name: Habilitar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar vista funcional aprobada
        run: |
          mkdir -p site
          git fetch origin functional-preview --depth=1
          git show FETCH_HEAD:preview/index.html > site/index.html
          test -s site/index.html
          grep -q "YOYOLETRASAI" site/index.html
          grep -q "Bosque Mágico" site/index.html
          touch site/.nojekyll

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always()
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Informar estado en PR 3
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- yoyo-functional-pages-status -->'
            const build = '${{ needs.build.result }}'
            const deploy = '${{ needs.deploy.result }}'
            const pageUrl = '${{ needs.deploy.outputs.page_url }}' || 'not-available'
            const body = `${marker}\nVista funcional para \`${context.sha}\`\n- build: **${build}**\n- deploy: **${deploy}**\n- url: ${pageUrl}`
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3,
              per_page: 100
            })
            const previous = comments.find(comment => comment.body && comment.body.includes(marker))
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 3,
                body
              })
            }
