name: Publicar rebuild en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar publicación correcta
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
      - name: Verificar ruta pública
        run: test -f nueva-plataforma-2026/index.html
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar dashboard nuevo
        id: deployment
        uses: actions/deploy-pages@v4

