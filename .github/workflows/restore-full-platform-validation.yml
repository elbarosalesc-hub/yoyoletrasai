name: Validate Full Platform + YOYO 3.6

on:
  push:
    branches:
      - agent/restore-full-platform-yoyo-3-6
      - agent/owner-command-center-yoyo-3-6
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Typecheck full Next platform
        run: npm run typecheck
      - name: Build full Next platform
        run: npm run build
      - name: Verify preserved platform routes
        run: |
          test -f apps/web/app/app/page.tsx
          test -f apps/web/app/biblioteca/page.tsx
          test -f apps/web/app/cursos/page.tsx
          test -f apps/web/app/evaluaciones/page.tsx
          test -f apps/web/app/inclusion/page.tsx
          test -f apps/web/app/informes/page.tsx
          test -f apps/web/app/integraciones/page.tsx
          test -f apps/web/app/profesor-virtual/page.tsx
          test -f apps/web/app/seguimiento/page.tsx
          test -f apps/web/app/yoyo-ia/page.tsx
          test -f apps/web/app/investigacion/page.tsx
          test -f apps/web/app/fuentes-ia/page.tsx
          test -f apps/web/app/planificaciones/page.tsx
          test -f apps/web/app/pictogramas/page.tsx
          test -f apps/web/app/institucion/page.tsx
          test -f apps/web/app/caligrafia/page.tsx
          test -f apps/web/app/herramientas/page.tsx
          test -f apps/web/app/propietaria/page.tsx
      - name: Verify owner command center isolation
        run: |
          test -f apps/web/app/propietaria/OwnerCommandCenter.tsx
          test -f apps/web/app/propietaria/owner-command-center.module.css
          grep -q "Producción" apps/web/app/propietaria/OwnerCommandCenter.tsx
          grep -q "Dominio permanente" apps/web/app/propietaria/OwnerCommandCenter.tsx
          grep -q "Release explícito" apps/web/app/propietaria/OwnerCommandCenter.tsx
          ! grep -R "vercel alias set\|vercel deploy --prod\|deploy_to_vercel" apps/web/app/propietaria
      - name: Verify owner and Google safeguards
        run: |
          grep -q "platform_admin" apps/web/app/propietaria/page.tsx
          grep -q "propietaria" apps/web/app/propietaria/page.tsx
          grep -q "SUPABASE_SECRET_KEY\|SUPABASE_SERVICE_ROLE_KEY" apps/web/app/propietaria/page.tsx
          test -f apps/web/app/auth/google/route.ts
          test -f apps/web/app/auth/callback/route.ts
      - name: Verify YOYO runtime safeguards
        run: |
          test -f apps/web/app/api/yoyo/generate/route.ts
          grep -q "ownerUnlimited: true" apps/web/app/api/yoyo/generate/route.ts
          grep -q "OFFICIAL_SOURCES_REQUIRED" apps/web/app/api/yoyo/generate/route.ts
      - name: Verify official research safeguards
        run: |
          test -f apps/web/lib/yoyo/research.ts
      - name: Verify storage architecture
        run: |
          test -d supabase
      - name: Verify caligraphy completeness
        run: |
          grep -q "Manuscrita minúscula" apps/web/app/caligrafia/page.tsx
          grep -q "Imprenta mayúscula" apps/web/app/caligrafia/page.tsx
