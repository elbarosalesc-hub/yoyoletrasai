name: Validate Full Platform + YOYO 3.6

on:
  push:
    branches:
      - agent/restore-full-platform-yoyo-3-6
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Typecheck full Next platform
        run: npm run typecheck
      - name: Build full Next platform
        run: npm run build
      - name: Verify preserved platform routes
        run: |
          test -f apps/web/app/app/page.tsx
          test -f apps/web/app/biblioteca/page.tsx
          test -f apps/web/app/cursos/page.tsx
          test -f apps/web/app/evaluaciones/page.tsx
          test -f apps/web/app/inclusion/page.tsx
          test -f apps/web/app/informes/page.tsx
          test -f apps/web/app/integraciones/page.tsx
          test -f apps/web/app/profesor-virtual/page.tsx
          test -f apps/web/app/seguimiento/page.tsx
          test -f apps/web/app/yoyo-ia/page.tsx
          test -f apps/web/app/investigacion/page.tsx
          test -f apps/web/app/fuentes-ia/page.tsx
          test -f apps/web/app/planificaciones/page.tsx
          test -f apps/web/app/pictogramas/page.tsx
          test -f apps/web/app/institucion/page.tsx
          test -f apps/web/app/espacio-estudiante/page.tsx
          test -f apps/web/app/propietaria/page.tsx
          test -f apps/web/app/caligrafia/page.tsx
          test -f apps/web/app/herramientas/page.tsx
      - name: Verify owner and Google safeguards
        run: |
          grep -q "platform_admin" apps/web/app/propietaria/page.tsx
          grep -q "plan_id','propietaria" apps/web/app/propietaria/page.tsx
          grep -q "aes-256-gcm" apps/web/app/api/owner/yoyo-key/route.ts
          grep -q "signInWithOAuth" apps/web/app/auth/google/route.ts
          grep -q "provider: 'google'" apps/web/app/auth/google/route.ts
          grep -q "access_type: 'offline'" apps/web/app/auth/google/route.ts
      - name: Verify YOYO runtime safeguards
        run: |
          grep -q "ownerUnlimited: true" apps/web/app/api/yoyo/generate/route.ts
          grep -Eq "disallowPromptTraining[[:space:]]*:[[:space:]]*true" apps/web/app/api/yoyo/generate/route.ts
          grep -q "YOYO-IA-EDU-CL-001" apps/web/app/api/yoyo/generate/route.ts
          grep -q "generateYoyoNative" apps/web/app/api/yoyo/generate/route.ts
          grep -q "YOYO_ALLOW_EXTERNAL_FALLBACK" apps/web/lib/ai/yoyo-runtime.ts
      - name: Verify official research safeguards
        run: |
          test -f apps/web/lib/ai/official-sources.ts
          test -f apps/web/lib/ai/official-search.ts
          grep -q "OFFICIAL_SOURCE_DOMAINS" apps/web/lib/ai/official-sources.ts
          grep -q "mineduc.cl" apps/web/lib/ai/official-sources.ts
          grep -q "curriculumnacional.cl" apps/web/lib/ai/official-sources.ts
          grep -q "OFFICIAL_SOURCES_REQUIRED" apps/web/app/api/yoyo/generate/route.ts
          grep -q "officialOnly: true" apps/web/lib/ai/official-search.ts
          grep -q "Fuentes oficiales utilizadas" apps/web/app/yoyo-ia/page.tsx
      - name: Verify storage architecture
        run: |
          test -f apps/web/lib/storage/yoyo.ts
          test -f apps/web/lib/storage/google.ts
          grep -q "ownership:'platform-controlled'" apps/web/lib/storage/yoyo.ts
          grep -q "private, no-store" apps/web/lib/storage/google.ts
      - name: Verify caligraphy completeness
        run: |
          grep -q "Imprenta mayúscula" apps/web/app/caligrafia/page.tsx
          grep -q "Imprenta minúscula" apps/web/app/caligrafia/page.tsx
          grep -q "Manuscrita mayúscula" apps/web/app/caligrafia/page.tsx
          grep -q "Manuscrita minúscula" apps/web/app/caligrafia/page.tsx
          grep -q "Trazos base" apps/web/app/caligrafia/page.tsx
          grep -q "Lateralidad" apps/web/app/caligrafia/page.tsx
