name: Recover approved 3.6 exact

on:
  push:
    branches:
      - recovery/approved-3.6-exact
    paths:
      - .github/workflows/recover-approved-3-6-exact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/approved-3.6-exact
          fetch-depth: 0

      - name: Rehydrate and verify approved source
        env:
          GH_TOKEN: ${{ github.token }}
          BLOB_SHA: b17860fafad007d7a27305c53556f87651f9e210
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/yoyo-approved /tmp/yoyo-payload.tar.gz
          mkdir -p /tmp/yoyo-approved
          # This Git blob stores the approved tar.gz as base64 text.
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${BLOB_SHA}" --jq .content | tr -d '\r\n' | base64 -d > /tmp/yoyo-payload.tar.gz
          tar -xzf /tmp/yoyo-payload.tar.gz -C /tmp/yoyo-approved
