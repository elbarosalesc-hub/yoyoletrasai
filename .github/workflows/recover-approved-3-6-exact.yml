          6c071448725b2644e2e9ac70914db86b6d33707791c4bcbab00e8a8de3e98ddd  supabase/migrations/20260810194000_index_ai_entitlement_foreign_keys.sql
          5ab324d98c80b8006a6ca3f956f3e08de5f614e67f6dab8fd11861f6e3844430  supabase/migrations/20260813143000_two_plans_token_quotas_owner_credentials.sql
          ce863215fc168e900c5625bf03f0ec2a3e5d4099acac3d9f3144eb96aebb1e3f  supabase/migrations/20260813185000_yoyo_core_resource_factory.sql
          91d944528367f6e7e6e669f045abf607cc911cc54896ed530ed915fd9d71d2eb  supabase/migrations/20260813190000_yoyo_core_google_storage_and_superior_file_limits.sql
          64d23c50a50b3b491c1750123ab0fa80d8130e4331b59e2622d531587efa7a7f  vercel.json
          500c179267df44612733a4a123d70a56ed568d6078610f28c20bc7d428616d1e  vite.config.js
          EOF
          sed -i 's/^          //' /tmp/approved.sha256
          sha256sum -c /tmp/approved.sha256

      - name: Replace branch contents with approved source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} + || true
          find .github/workflows -type f ! -name recover-approved-3-6-exact.yml -delete || true
          cp -a /tmp/yoyo-approved/. .
          rm -rf node_modules dist

      - name: Install and build recovered source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/index.html

      - name: Commit exact recovered baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "Recuperar plataforma aprobada 3.6 como nueva base"
          git push origin HEAD:recovery/approved-3.6-exact
