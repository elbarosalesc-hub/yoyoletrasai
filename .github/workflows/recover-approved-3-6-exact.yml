name: Recover approved 3.6 exact

on:
  push:
    branches:
      - recovery/approved-3.6-exact
    paths:
      - .github/workflows/recover-approved-3-6-exact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/approved-3.6-exact
          fetch-depth: 0

      - name: Rehydrate and verify approved source
        env:
          GH_TOKEN: ${{ github.token }}
          BLOB_SHA: b17860fafad007d7a27305c53556f87651f9e210
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/yoyo-approved /tmp/yoyo-raw /tmp/yoyo-blob.json /tmp/yoyo-stage1 /tmp/yoyo-payload.tar.gz
          mkdir -p /tmp/yoyo-approved

          gh api -H "Accept: application/vnd.github.raw+json" "repos/${GITHUB_REPOSITORY}/git/blobs/${BLOB_SHA}" > /tmp/yoyo-raw
          RAW_HEX="$(od -An -tx1 -N2 /tmp/yoyo-raw | tr -d ' ')"
          RAW_PREFIX="$(head -c 16 /tmp/yoyo-raw | tr -cd '[:print:]' || true)"
          echo "raw_bytes=$(wc -c < /tmp/yoyo-raw | tr -d ' ') raw_hex=${RAW_HEX} raw_prefix=${RAW_PREFIX}"

          if [ "$RAW_HEX" = "1f8b" ]; then
            cp /tmp/yoyo-raw /tmp/yoyo-payload.tar.gz
          elif [ "${RAW_PREFIX#H4sI}" != "$RAW_PREFIX" ]; then
            tr -d '\r\n' < /tmp/yoyo-raw | base64 -d > /tmp/yoyo-payload.tar.gz
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${BLOB_SHA}" > /tmp/yoyo-blob.json
            ENCODING="$(jq -r '.encoding // empty' /tmp/yoyo-blob.json)"
            JSON_PREFIX="$(jq -r '.content // empty' /tmp/yoyo-blob.json | tr -d '\r\n' | head -c 16)"
            echo "json_encoding=${ENCODING} json_prefix=${JSON_PREFIX}"
            test "$ENCODING" = "base64"
            jq -r '.content' /tmp/yoyo-blob.json | tr -d '\r\n' | base64 -d > /tmp/yoyo-stage1
            STAGE_HEX="$(od -An -tx1 -N2 /tmp/yoyo-stage1 | tr -d ' ')"
            STAGE_PREFIX="$(head -c 16 /tmp/yoyo-stage1 | tr -cd '[:print:]' || true)"
            echo "stage1_bytes=$(wc -c < /tmp/yoyo-stage1 | tr -d ' ') stage1_hex=${STAGE_HEX} stage1_prefix=${STAGE_PREFIX}"
            if [ "$STAGE_HEX" = "1f8b" ]; then
              cp /tmp/yoyo-stage1 /tmp/yoyo-payload.tar.gz
            elif [ "${STAGE_PREFIX#H4sI}" != "$STAGE_PREFIX" ]; then
              tr -d '\r\n' < /tmp/yoyo-stage1 | base64 -d > /tmp/yoyo-payload.tar.gz
            else
              echo "Formato de payload no reconocido" >&2
              exit 1
            fi
          fi

          test "$(od -An -tx1 -N2 /tmp/yoyo-payload.tar.gz | tr -d ' ')" = "1f8b"
          tar -tzf /tmp/yoyo-payload.tar.gz >/dev/null
          tar -xzf /tmp/yoyo-payload.tar.gz -C /tmp/yoyo-approved
          cd /tmp/yoyo-approved
          test "$(find . -type f | wc -l | tr -d ' ')" = "52"
          echo '1051a299003dbb9326e577c2c2db6592f852e8b1710b34946650768d3ed8459e  src/App.jsx' | sha256sum -c -
          echo '9c4dbcd32d8cd583a4f769a193fb4f6800227a4d84f68c802b578304208edce8  src/styles.css' | sha256sum -c -
          echo 'ff589c5f63f7ef7b3ccbab00ff6ccd86242f8412d5afea6e53bd9dbf045bd0b4  src/modules.jsx' | sha256sum -c -
          echo 'a6db1a16a1b6fc61bb83b0260c2f568385975baae164a7d18469f5b459afe706  api/ai/generate.js' | sha256sum -c -
          echo '7c625b2a4de64372592da4b76bb3eff5f4d8507b58847acafb27b5085aba4602  src/features/YoyoAIStudio.jsx' | sha256sum -c -
          echo '43b8e47486025eaa89c7d9919f8ea373adf992b0f7035ab1b91b5afe4e4e150a  src/features/SourceLab.jsx' | sha256sum -c -
          echo '824bb863262ae6be4fdb91042af0d025f0699defd6534904d94961336ae357a9  src/features/ImmersiveGames.jsx' | sha256sum -c -
          echo '5cdf3f2fca7fa6b5d453b17a58b56c1a9c246e6795ecb4d1db4f9a9f7a56798e  package-lock.json' | sha256sum -c -
          echo '1699ee428437a8ce08e0cb2cfbcf712cefe4733276f93297ab84562ba7b63d75  public/assets/phonics-illustrations-v1.webp' | sha256sum -c -
          echo '633b910f07a48e8bf342eeaf8b14fda99bd594f9bd6bacfc3d9dbefb6cb40c6f  public/assets/subject-covers-v1.webp' | sha256sum -c -
          echo '1837b76905577f7de3ac60b5c9586fbe543a43437d42252724c547138a910efc  public/assets/yoyo-learning-hero-v2.webp' | sha256sum -c -
          grep -q '"version": "3.6.0"' package.json

      - name: Replace branch contents with approved source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} + || true
          find .github/workflows -type f ! -name recover-approved-3-6-exact.yml -delete || true
          cp -a /tmp/yoyo-approved/. .
          rm -rf node_modules dist

      - name: Install and build recovered source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/index.html

      - name: Commit recovered baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recuperar plataforma aprobada 3.6 como nueva base"
          git push origin HEAD:recovery/approved-3.6-exact
