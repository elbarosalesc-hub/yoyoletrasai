name: Recover approved 3.6 exact

on:
  push:
    branches:
      - recovery/approved-3.6-exact
    paths:
      - .github/workflows/recover-approved-3-6-exact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/approved-3.6-exact
          fetch-depth: 0

      - name: Rehydrate approved source from immutable Git blob
        env:
          GH_TOKEN: ${{ github.token }}
          BLOB_SHA: b17860fafad007d7a27305c53556f87651f9e210
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/yoyo-approved /tmp/yoyo-payload.b64 /tmp/yoyo-payload.tar.gz
          mkdir -p /tmp/yoyo-approved
          # GitHub API returns the blob itself base64-encoded. The blob stores the
          # approved tar.gz as base64 text, so two decoding stages are required.
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${BLOB_SHA}" --jq .content | tr -d '\n' | base64 -d > /tmp/yoyo-payload.b64
          tr -d '\r\n' < /tmp/yoyo-payload.b64 | base64 -d > /tmp/yoyo-payload.tar.gz
          echo "Payload SHA256: $(sha256sum /tmp/yoyo-payload.tar.gz | awk '{print $1}')"
          tar -tzf /tmp/yoyo-payload.tar.gz >/tmp/yoyo-payload-files.txt
          tar -xzf /tmp/yoyo-payload.tar.gz -C /tmp/yoyo-approved
          test -f /tmp/yoyo-approved/package.json
          test -f /tmp/yoyo-approved/src/App.jsx
          test -f /tmp/yoyo-approved/src/features/YoyoAIStudio.jsx
          test -f /tmp/yoyo-approved/src/features/SourceLab.jsx
          test -f /tmp/yoyo-approved/src/features/ImmersiveGames.jsx
          test -f /tmp/yoyo-approved/src/features/ReadingPlan.jsx
          test -f /tmp/yoyo-approved/src/modules.jsx
          test -f /tmp/yoyo-approved/api/health.js
          test -f /tmp/yoyo-approved/vercel.json
          grep -q '"version": "3.6.0"' /tmp/yoyo-approved/package.json
          grep -q "YoyoAIStudio" /tmp/yoyo-approved/src/App.jsx
          grep -q "SourceLab" /tmp/yoyo-approved/src/App.jsx
          grep -q "ImmersiveGames" /tmp/yoyo-approved/src/App.jsx
          grep -q "ReadingPlan" /tmp/yoyo-approved/src/App.jsx

      - name: Replace branch contents with approved source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} + || true
          find .github/workflows -type f ! -name recover-approved-3-6-exact.yml -delete || true
          cp -a /tmp/yoyo-approved/. .
          rm -rf node_modules dist

      - name: Install and build recovered source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/index.html

      - name: Commit exact recovered baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "Recuperar plataforma aprobada 3.6 como nueva base"
          git push origin HEAD:recovery/approved-3.6-exact
