name: Generate billing migration

on:
  push:
    branches:
      - feat/mercadopago-subscriptions

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mercadopago-subscriptions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate migration with Supabase CLI
        run: npx --yes supabase@latest migration new add_billing_subscriptions
      - name: Commit generated migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations
          git commit -m "Generate billing migration with Supabase CLI"
          git push origin HEAD:feat/mercadopago-subscriptions
