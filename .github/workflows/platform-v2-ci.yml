name: Platform V2 CI

on:
  pull_request:
    paths:
      - 'platform-v2/**'
      - '.github/workflows/platform-v2-ci.yml'
  push:
    branches:
      - develop
    paths:
      - 'platform-v2/**'
      - '.github/workflows/platform-v2-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-v2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
