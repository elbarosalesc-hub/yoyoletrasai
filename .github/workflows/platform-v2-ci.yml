name: Platform V2 CI

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'platform-v2/**'
      - '.github/workflows/platform-v2-ci.yml'
      - 'package.json'
  push:
    branches:
      - develop
    paths:
      - 'apps/web/**'
      - 'platform-v2/**'
      - '.github/workflows/platform-v2-ci.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate-preview-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install preview dependencies
        run: npm install --workspaces --include-workspace-root
      - name: Typecheck preview app
        run: npm run typecheck --workspace=web
      - name: Build preview app
        run: npm run build --workspace=web

  validate-platform-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-v2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
