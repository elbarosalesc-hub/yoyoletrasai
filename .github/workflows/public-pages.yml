name: Publicar portada SEO YOYO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-yoyo-public
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portada publica
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public-site

      - name: Verificar portada SEO
        run: |
          test -f public-site/index.html
          test -f public-site/robots.txt
          test -f public-site/sitemap.xml

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
