name: Vista previa para aprobación

on:
  push:
    branches:
      - agent/rebuild-reference-model-v3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yoyo-review-pages
  cancel-in-progress: true

jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Create review-only Next.js configuration
        run: |
          cat > apps/web/next.config.mjs <<'EOF'
          const repositoryBase = '/yoyoletrasai'

          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            trailingSlash: true,
            basePath: repositoryBase,
            assetPrefix: repositoryBase,
            images: { unoptimized: true }
          }

          export default nextConfig
          EOF

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Build static review
        run: npm run build

      - name: Prepare GitHub Pages files
        run: |
          touch apps/web/out/.nojekyll
          cp apps/web/out/app/index.html apps/web/out/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy-review:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}app/
    runs-on: ubuntu-latest
    needs: build-review
    steps:
      - name: Deploy review to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
