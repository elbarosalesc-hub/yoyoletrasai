name: Repair Next Production - Closed Safety Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Production protection active
        shell: bash
        run: |
          echo "La reparación única ya terminó."
          echo "No se ejecutan cambios automáticos sobre producción, dominios ni aliases."
          echo "Toda futura publicación exige validación completa y acción manual explícita."
