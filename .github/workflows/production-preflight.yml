name: Production preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_DEPLOY_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      YOYO_OWNER_EMAIL: ${{ secrets.YOYO_OWNER_EMAIL }}
      YOYO_RUNTIME_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.YOYO_RUNTIME_CLOUDFLARE_ACCOUNT_ID }}
      YOYO_RUNTIME_CLOUDFLARE_API_TOKEN: ${{ secrets.YOYO_RUNTIME_CLOUDFLARE_API_TOKEN }}
      YOYO_PRODUCTION_URL: ${{ vars.YOYO_PRODUCTION_URL }}
      YOYO_BILLING_PROVIDER: ${{ vars.YOYO_BILLING_PROVIDER }}
      MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
      MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
      MERCADOPAGO_PREMIUM_PLAN_ID: ${{ secrets.MERCADOPAGO_PREMIUM_PLAN_ID }}
      MERCADOPAGO_INSTITUTION_PLAN_ID: ${{ secrets.MERCADOPAGO_INSTITUTION_PLAN_ID }}
    steps:
      - name: Validate required production configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY CRON_SECRET YOYO_OWNER_EMAIL YOYO_RUNTIME_CLOUDFLARE_ACCOUNT_ID YOYO_RUNTIME_CLOUDFLARE_API_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Falta configurar $key en GitHub environment production."
              missing=1
            fi
          done
          if [ "${YOYO_BILLING_PROVIDER:-}" = "mercadopago" ]; then
            for key in MERCADOPAGO_ACCESS_TOKEN MERCADOPAGO_WEBHOOK_SECRET YOYO_PRODUCTION_URL; do
              if [ -z "${!key:-}" ]; then
                echo "::error::Mercado Pago está habilitado pero falta $key."
                missing=1
              fi
            done
            if [ -z "${MERCADOPAGO_PREMIUM_PLAN_ID:-}" ] && [ -z "${MERCADOPAGO_INSTITUTION_PLAN_ID:-}" ]; then
              echo "::error::Mercado Pago requiere al menos un ID de plan real."
              missing=1
            fi
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Configuración obligatoria presente."

      - name: Verify Cloudflare account credentials
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}")"
          node -e 'const body=JSON.parse(process.argv[1]); if(!body.success) process.exit(1); console.log("Cloudflare account verified.")' "$response"

      - name: Check Worker existence
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/worker.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/yoyoletrasai")"
          if [ "$status" = "200" ]; then
            echo "YOYO_WORKER_EXISTS=true" >> "$GITHUB_ENV"
            echo "Worker yoyoletrasai encontrado."
          elif [ "$status" = "404" ]; then
            echo "YOYO_WORKER_EXISTS=false" >> "$GITHUB_ENV"
            echo "::warning::Worker yoyoletrasai aún no existe en esta cuenta; el primer deploy deberá crearlo."
          else
            echo "::error::Cloudflare devolvió HTTP $status al comprobar el Worker."
            cat /tmp/worker.json
            exit 1
          fi

      - name: Validate production URL when configured
        if: ${{ env.YOYO_PRODUCTION_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$YOYO_PRODUCTION_URL" in
            https://*) ;;
            *) echo "::error::YOYO_PRODUCTION_URL debe usar https://"; exit 1 ;;
          esac
          code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "${YOYO_PRODUCTION_URL%/}/api/health" || true)"
          if [ "$code" = "200" ]; then
            echo "Producción responde correctamente en /api/health."
          else
            echo "::warning::YOYO_PRODUCTION_URL está configurada pero /api/health respondió HTTP ${code:-000}."
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## YOYO · Production preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "- Secretos obligatorios: comprobados sin exponer valores" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cuenta Cloudflare: validada si este job quedó verde" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker esperado: yoyoletrasai" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker existente: ${YOYO_WORKER_EXISTS:-no comprobado}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Facturación: ${YOYO_BILLING_PROVIDER:-no configurada}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${YOYO_PRODUCTION_URL:-}" ]; then
            echo "- URL de producción: configurada" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- URL de producción: no configurada" >> "$GITHUB_STEP_SUMMARY"
          fi
