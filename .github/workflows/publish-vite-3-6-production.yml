name: Publish YoYoLetrasAI 3.6 Production

on:
  workflow_dispatch:
  push:
    branches:
      - agent/publish-v3-6-vite
    paths:
      - .github/workflows/publish-vite-3-6-production.yml
      - .github/preview-token-ready.txt

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_Wq1pPeDlHDUfKwJNyH4ZSLFD
  VERCEL_PROJECT_ID: prj_90GNn7Y95ZZIYAJEyOoJCyi6NO0p
  VERCEL_SCOPE: elbarosalesc-pngs-projects

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: VERCEL_TOKEN
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4

      - name: Require Vercel credential
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Falta VERCEL_TOKEN en el Environment VERCEL_TOKEN de GitHub."
            exit 2
          fi

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.1.6

      - name: Pull preview environment
        run: vercel pull --yes --environment=preview --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build preview artifact
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy immutable preview
        id: preview
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify health is publishable 3.6.0
        shell: bash
        run: |
          url="${{ steps.preview.outputs.url }}"
          body="$(curl --fail --silent --show-error "$url/api/health")"
          printf '%s\n' "$body"
          printf '%s' "$body" | grep -q '"status":"ok"'
          printf '%s' "$body" | grep -q '"version":"3.6.0"'
          printf '%s' "$body" | grep -q '"application":"operational"'
          printf '%s' "$body" | grep -q '"resourcesApi":"operational"'
          if printf '%s' "$body" | grep -q '"probe"'; then
            echo "::error::Preview de prueba detectado; se cancela la publicacion."
            exit 3
          fi

      - name: Verify resources API
        shell: bash
        run: |
          url="${{ steps.preview.outputs.url }}"
          body="$(curl --fail --silent --show-error "$url/api/resources")"
          test -n "$body"
          printf '%s\n' "$body" | head -c 2000

      - name: Verify root application
        shell: bash
        run: |
          url="${{ steps.preview.outputs.url }}"
          curl --fail --silent --show-error "$url/" > /tmp/root.html
          test -s /tmp/root.html
          grep -qi 'YoYo' /tmp/root.html

      - name: Pull production environment
        run: vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy validated release to production
        id: production
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public production
        shell: bash
        run: |
          body="$(curl --fail --silent --show-error https://yoyoletrasai.vercel.app/api/health)"
          printf '%s\n' "$body"
          printf '%s' "$body" | grep -q '"status":"ok"'
          printf '%s' "$body" | grep -q '"version":"3.6.0"'
          printf '%s' "$body" | grep -q '"application":"operational"'
          printf '%s' "$body" | grep -q '"resourcesApi":"operational"'
          if printf '%s' "$body" | grep -q '"probe"'; then
            echo "::error::Produccion contiene marcador probe."
            exit 4
          fi
