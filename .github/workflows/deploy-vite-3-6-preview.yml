name: Deploy YoYoLetrasAI 3.6 Preview

on:
  push:
    branches:
      - agent/publish-v3-6-vite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: VERCEL_TOKEN
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: team_Wq1pPeDlHDUfKwJNyH4ZSLFD
      VERCEL_PROJECT_ID: prj_90GNn7Y95ZZIYAJEyOoJCyi6NO0p
      VERCEL_SCOPE: elbarosalesc-pngs-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN || secrets.VERCEL_DEPLOY_TOKEN || vars.VERCEL_TOKEN || vars.VERCEL_ACCESS_TOKEN || vars.VERCEL_DEPLOY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Vercel credential
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::El environment VERCEL_TOKEN existe, pero no contiene un secreto utilizable llamado VERCEL_TOKEN."
            exit 2
          fi

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.1.6

      - name: Reset local Vercel link
        run: rm -rf .vercel

      - name: Pull preview environment by explicit project
        run: vercel pull --yes --environment=preview --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build preview artifact
        run: vercel build --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Deploy immutable preview
        id: deploy
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --project="$VERCEL_PROJECT_ID" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview YoYoLetrasAI 3.6" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify preview health
        shell: bash
        run: |
          url="${{ steps.deploy.outputs.url }}"
          body="$(curl --fail --silent --show-error "$url/api/health")"
          printf '%s\n' "$body"
          printf '%s' "$body" | grep -q '"status":"ok"'
          printf '%s' "$body" | grep -q '"version":"3.6.0"'
          printf '%s' "$body" | grep -q '"application":"operational"'
          printf '%s' "$body" | grep -q '"resourcesApi":"operational"'
          if printf '%s' "$body" | grep -q '"probe"'; then
            echo "::error::El preview contiene marcador probe y no puede publicarse."
            exit 3
          fi

      - name: Verify preview resources
        shell: bash
        run: |
          url="${{ steps.deploy.outputs.url }}"
          body="$(curl --fail --silent --show-error "$url/api/resources")"
          test -n "$body"

      - name: Verify preview application root
        shell: bash
        run: |
          url="${{ steps.deploy.outputs.url }}"
          curl --fail --silent --show-error "$url/" > /tmp/root.html
          test -s /tmp/root.html
          grep -qi 'YoYo' /tmp/root.html

      - name: Record preview only
        shell: bash
        run: |
          echo "Preview validado. No se promueve automaticamente a produccion." >> "$GITHUB_STEP_SUMMARY"
