name: Deploy YoYoLetrasAI 3.6 Preview

on:
  push:
    branches:
      - agent/publish-v3-6-vite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: VERCEL_TOKEN
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: team_Wq1pPeDlHDUfKwJNyH4ZSLFD
      VERCEL_PROJECT_ID: prj_90GNn7Y95ZZIYAJEyOoJCyi6NO0p
      VERCEL_SCOPE: elbarosalesc-pngs-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN || secrets.VERCEL_DEPLOY_TOKEN || vars.VERCEL_TOKEN || vars.VERCEL_ACCESS_TOKEN || vars.VERCEL_DEPLOY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Vercel credential
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::El environment VERCEL_TOKEN existe, pero no contiene una credencial Vercel utilizable."
            exit 2
          fi

      - name: Verify source integrity and 3.6 markers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tree_sha="$(git rev-parse HEAD^{tree})"
          tracked_files="$(git ls-files | wc -l | tr -d ' ')"
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum > /tmp/yoyoletrasai-3.6.sha256
          manifest_sha="$(sha256sum /tmp/yoyoletrasai-3.6.sha256 | awk '{print $1}')"
          test -f package.json
          test -f vercel.json
          test -f src/App.jsx
          test -f src/features/OwnerAccessManager.jsx
          test -f src/features/OwnerFactoryManager.jsx
          test -f api/health.js
          test -f api/resources.js
          test -f shared/yoyo-core.js
          grep -q '"version": "3.6.0"' package.json
          grep -q "version: '3.6.0'" api/health.js
          {
            echo "### Integridad YoYoLetrasAI 3.6"
            echo "- Commit: $GITHUB_SHA"
            echo "- Git tree: $tree_sha"
            echo "- Archivos versionados: $tracked_files"
            echo "- SHA-256 del manifiesto: $manifest_sha"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.1.6

      - name: Link only the existing Vercel project locally
        shell: bash
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull preview environment
        run: vercel pull --yes --environment=preview --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build preview artifact
        run: vercel build --target=preview --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Deploy immutable preview only
        id: deploy
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview YoYoLetrasAI 3.6" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify preview health
        shell: bash
        run: |
          url="${{ steps.deploy.outputs.url }}"
          body="$(curl --fail --silent --show-error "$url/api/health")"
          printf '%s\n' "$body"
          printf '%s' "$body" | grep -q '"status":"ok"'
          printf '%s' "$body" | grep -q '"version":"3.6.0"'
          printf '%s' "$body" | grep -q '"application":"operational"'
          printf '%s' "$body" | grep -q '"resourcesApi":"operational"'
          if printf '%s' "$body" | grep -q '"probe"'; then
            echo "::error::El preview contiene marcador probe y no puede publicarse."
            exit 3
          fi

      - name: Verify preview resources
        shell: bash
        run: |
          url="${{ steps.deploy.outputs.url }}"
          body="$(curl --fail --silent --show-error "$url/api/resources")"
          test -n "$body"

      - name: Verify preview application root
        shell: bash
        run: |
          url="${{ steps.deploy.outputs.url }}"
          curl --fail --silent --show-error "$url/" > /tmp/root.html
          test -s /tmp/root.html
          grep -qi 'YoYo' /tmp/root.html

      - name: Record preview only
        shell: bash
        run: |
          echo "Preview validado. No se usa --prod y no se promueve automaticamente a produccion." >> "$GITHUB_STEP_SUMMARY"
