name: Publish Full Platform - Owner Command Center

on:
  push:
    branches:
      - agent/owner-command-center-yoyo-3-6
    paths:
      - .github/workflows/publish-full-platform-production.yml

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_Wq1pPeDlHDUfKwJNyH4ZSLFD
  VERCEL_PROJECT_ID: prj_90GNn7Y95ZZIYAJEyOoJCyi6NO0p
  VERCEL_SCOPE: elbarosalesc-pngs-projects
  PERMANENT_DOMAIN: yoyoletrasai.vercel.app
  ROLLBACK_DEPLOYMENT: yoyoletrasai-3epboa8qb-elbarosalesc-pngs-projects.vercel.app

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: VERCEL_TOKEN
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout validated release branch
        uses: actions/checkout@v4
      - name: Require Vercel credential
        shell: bash
        run: test -n "${VERCEL_TOKEN:-}" || { echo "::error::Falta VERCEL_TOKEN; producción no se modifica"; exit 2; }
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.1.6
      - name: Verify current permanent production before release
        shell: bash
        run: |
          set -euo pipefail
          base="https://$PERMANENT_DOMAIN"
          health="$(curl --retry 8 --retry-delay 2 --fail --silent --show-error "$base/api/health")"
          printf '%s\n' "$health" | grep -q '"application":"operational"'
          printf '%s\n' "$health" | grep -q '"configuration":"valid"'
          printf '%s\n' "$health" | grep -q '"database":"reachable"'
          curl --retry 8 --retry-delay 2 --fail --location --silent --show-error "$base/caligrafia" | grep -qi 'Caligrafía completa'
      - name: Pull preview environment
        run: vercel pull --yes --environment=preview --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" --cwd apps/web
      - name: Build isolated preview
        run: vercel build --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" --cwd apps/web
      - name: Deploy isolated preview
        id: preview
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" --cwd apps/web)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview validable: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate complete preview
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.preview.outputs.url }}"
          health="$(curl --retry 10 --retry-delay 2 --fail --silent --show-error "$base/api/health")"
          printf '%s\n' "$health" | grep -q '"application":"operational"'
          printf '%s\n' "$health" | grep -q '"configuration":"valid"'
          printf '%s\n' "$health" | grep -q '"database":"reachable"'
          for path in /acceso /app /caligrafia /herramientas /yoyo-ia /biblioteca /evaluaciones /inclusion /informes /integraciones /propietaria; do
            code="$(curl --retry 8 --retry-delay 2 --silent --location --output /tmp/page.html --write-out '%{http_code}' "$base$path")"
            test "$code" -ge 200 -a "$code" -lt 400
          done
          curl --retry 8 --retry-delay 2 --fail --location --silent --show-error "$base/caligrafia" | grep -qi 'Manuscrita'
          curl --retry 8 --retry-delay 2 --fail --location --silent --show-error "$base/yoyo-ia" | grep -qi 'YOYO IA'
      - name: Pull production environment
        run: vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" --cwd apps/web
      - name: Build immutable production artifact
        run: vercel build --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" --cwd apps/web
      - name: Deploy validated production candidate without changing permanent domain
        id: production
        shell: bash
        run: |
          url="$(vercel deploy --prebuilt --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" --cwd apps/web)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Producción candidata: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate direct production candidate before alias
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.production.outputs.url }}"
          health="$(curl --retry 10 --retry-delay 2 --fail --silent --show-error "$base/api/health")"
          printf '%s\n' "$health" | grep -q '"application":"operational"'
          printf '%s\n' "$health" | grep -q '"configuration":"valid"'
          printf '%s\n' "$health" | grep -q '"database":"reachable"'
          for path in /acceso /app /caligrafia /herramientas /yoyo-ia /biblioteca /evaluaciones /inclusion /informes /integraciones /propietaria; do
            code="$(curl --retry 8 --retry-delay 2 --silent --location --output /tmp/page.html --write-out '%{http_code}' "$base$path")"
            test "$code" -ge 200 -a "$code" -lt 400
          done
      - name: Attach permanent domain with automatic rollback on verification failure
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ steps.production.outputs.url }}"
          if ! vercel alias set "$candidate" "$PERMANENT_DOMAIN" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"; then
            echo "::error::No se pudo reasignar el dominio; se conserva producción anterior"
            exit 1
          fi
          sleep 6
          base="https://$PERMANENT_DOMAIN"
          if ! health="$(curl --retry 10 --retry-delay 2 --fail --silent --show-error "$base/api/health")" || \
             ! printf '%s\n' "$health" | grep -q '"application":"operational"' || \
             ! printf '%s\n' "$health" | grep -q '"configuration":"valid"' || \
             ! printf '%s\n' "$health" | grep -q '"database":"reachable"' || \
             ! curl --retry 8 --retry-delay 2 --fail --location --silent --show-error "$base/caligrafia" | grep -qi 'Caligrafía completa' || \
             ! curl --retry 8 --retry-delay 2 --fail --location --silent --show-error "$base/yoyo-ia" | grep -qi 'YOYO IA'; then
            echo "::warning::Verificación posterior falló; restaurando despliegue estable anterior"
            vercel alias set "$ROLLBACK_DEPLOYMENT" "$PERMANENT_DOMAIN" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
            exit 1
          fi
          echo "Dominio permanente verificado sin regresión: https://$PERMANENT_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
