name: Premium validation

on:
  push:
    branches:
      - main
      - agent/full-premium-rebuild-v2
      - agent/corregir-mejorar-plataforma
  pull_request:
    branches:
      - main

jobs:
  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Build Cloudflare Worker with vinext
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build:vinext --workspace=web

      - name: Verify Cloudflare build output
        run: |
          test -d apps/web/dist/client
          test -f apps/web/dist/server/wrangler.json

      - name: Dry-run Cloudflare deployment bundle
        working-directory: apps/web
        run: npx wrangler deploy --dry-run --config dist/server/wrangler.json

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run start > /tmp/yoyoletrasai-next.log 2>&1 &
          echo $! > /tmp/yoyoletrasai-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/yoyoletrasai-next.log
          exit 1

      - name: Visual regression gate
        run: npx playwright test tests/e2e/visual-regression.spec.ts --reporter=line --workers=1

      - name: Browser and keyboard verification
        run: npx playwright test tests/e2e/public-preview.spec.ts tests/e2e/keyboard-navigation.spec.ts --reporter=line --workers=1

      - name: Authenticated regression gate
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${E2E_TEST_EMAIL:-}" ] && [ -n "${E2E_TEST_PASSWORD:-}" ]; then
            npx playwright test tests/e2e/authenticated-regression.spec.ts --reporter=line --workers=1
          else
            echo "::notice::Gate autenticado preparado pero omitido: faltan E2E_TEST_EMAIL/E2E_TEST_PASSWORD."
          fi

      - name: Lighthouse accessibility gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/yoyo-lighthouse
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          if [ -z "$CHROME_PATH" ]; then
            CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-headless-shell-linux64/chrome-headless-shell' -print -quit)"
          fi
          test -x "$CHROME_PATH"
          export CHROME_PATH

          npx lighthouse http://127.0.0.1:3000/presentacion \
            --only-categories=accessibility \
            --output=json \
            --output-path=/tmp/yoyo-lighthouse/presentacion.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet

          npx lighthouse http://127.0.0.1:3000/acceso \
            --only-categories=accessibility \
            --output=json \
            --output-path=/tmp/yoyo-lighthouse/acceso.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet

          node <<'NODE'
          const fs = require('node:fs')
          const reports = [
            ['presentacion', '/tmp/yoyo-lighthouse/presentacion.json'],
            ['acceso', '/tmp/yoyo-lighthouse/acceso.json'],
          ]
          let failed = false
          for (const [name, path] of reports) {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'))
            const score = report.categories?.accessibility?.score ?? 0
            const percent = Math.round(score * 100)
            console.log(`Lighthouse accessibility ${name}: ${percent}`)
            if (score < 0.95) {
              failed = true
              console.error(`::error::${name} obtuvo ${percent}; mínimo requerido 95.`)
            }
          }
          if (failed) process.exit(1)
          NODE

      - name: Upload visual regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-accessibility
          path: /tmp/yoyo-lighthouse/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vista-previa-aprobada
          path: /tmp/yoyo-preview/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/yoyoletrasai-next.log || true
