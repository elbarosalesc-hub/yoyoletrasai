name: Premium validation

on:
  push:
    branches:
      - main
      - agent/full-premium-rebuild-v2
      - agent/corregir-mejorar-plataforma
  pull_request:
    branches:
      - main

jobs:
  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Typecheck
        run: npm run typecheck -- --pretty false

      - name: Build Next.js
        run: npm run build

      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start application
        run: |
          npm run start > /tmp/yoyoletrasai-next.log 2>&1 &
          echo $! > /tmp/yoyoletrasai-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/yoyoletrasai-next.log
          exit 1

      - name: Browser verification
        run: npx playwright test tests/e2e/public-preview.spec.ts --reporter=line --workers=1

      - name: Upload preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vista-previa-aprobada
          path: /tmp/yoyo-preview/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/yoyoletrasai-next.log || true
