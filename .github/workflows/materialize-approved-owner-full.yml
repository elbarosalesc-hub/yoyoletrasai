name: Materialize Approved Owner Full Source

on:
  push:
    branches:
      - agent/restore-approved-owner-full-source
    paths:
      - .restore/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore approved interface and additive improvements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/yoyo-approved
          cat .restore/part-*.b64 | base64 --decode > /tmp/yoyo-approved.tar.gz
          tar -xzf /tmp/yoyo-approved.tar.gz -C /tmp/yoyo-approved
          cp -a /tmp/yoyo-approved/. .
          rm -rf .restore
          test -f src/App.jsx
          test -f src/modules.jsx
          test -f src/features/ImmersiveGames.jsx
          test -f src/features/CalligraphyStudio.jsx
          test -f src/features/ClassroomTools.jsx
          grep -q 'Educación que incluye' src/App.jsx
          grep -q 'Perfil propietario' src/data.js
          grep -q 'Imprenta mayúscula' src/features/CalligraphyStudio.jsx
          grep -q 'Fuentes oficiales verificables' src/features/YoyoAIStudio.jsx
      - name: Commit restored approved platform
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'yoyo-release-bot'
          git config user.email 'elba.rosalesc@gmail.com'
          git add -A
          git commit -m 'Restaurar plataforma Owner Full aprobada y sumar mejoras 3.6.1'
          git push origin HEAD:agent/restore-approved-owner-full-source
