name: Publicar revision base

on:
  push:
    branches:
      - gh-pages
    paths:
      - revision-base/**
      - .github/workflows/revision-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-revision-base
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4

      - name: Verify revision route
        run: test -f revision-base/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
