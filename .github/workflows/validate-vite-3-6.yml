name: Validate YoYoLetrasAI 3.6 Vite

on:
  push:
    branches:
      - agent/publish-v3-6-vite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite release
        run: npm run build

      - name: Verify release markers
        run: |
          test -f dist/index.html
          grep -q '3.6.0' package.json
          grep -q "version: '3.6.0'" api/health.js
