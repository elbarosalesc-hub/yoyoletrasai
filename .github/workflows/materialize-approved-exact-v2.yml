EOF
          : > /tmp/source.tar.xz.b64
          while read -r sha name; do
            echo "Fetching $name $sha"
            response="$(curl --fail-with-body -sS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/git/blobs/$sha")"
            printf '%s' "$response" | jq -er '.content' | tr -d '\n' | base64 -d >> /tmp/source.tar.xz.b64
          done < /tmp/chunks.tsv
          base64 -d /tmp/source.tar.xz.b64 > /tmp/source.tar.xz
          echo 'cb8240d7039ec858bb701b3cd14a19b1748e7241ae7e67ae939627a8adeb4822  /tmp/source.tar.xz' | sha256sum -c -
          mkdir -p /tmp/source
          tar -xJf /tmp/source.tar.xz -C /tmp/source

      - name: Verify all 52 approved files byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/manifest.tsv <<'EOF'
