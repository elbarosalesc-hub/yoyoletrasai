name: Materialize approved exact v2

on:
  push:
    branches:
      - recovery/approved-3.6-exact
    paths:
      - .github/workflows/materialize-approved-exact-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/approved-3.6-exact
          fetch-depth: 0

      - name: Rebuild exact approved transfer from Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/chunks.tsv <<'EOF'
