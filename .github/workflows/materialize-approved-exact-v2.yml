          test "$(wc -l < /tmp/manifest.tsv | tr -d ' ')" = '52'
          test "$(find /tmp/source -type f | wc -l | tr -d ' ')" = '52'
          while IFS=$'\t' read -r expected path; do
            test -f "/tmp/source/$path" || { echo "Missing $path"; exit 1; }
            actual="$(git hash-object "/tmp/source/$path")"
            test "$actual" = "$expected" || { echo "Hash mismatch $path expected=$expected actual=$actual"; exit 1; }
          done < /tmp/manifest.tsv
          echo 'All 52 approved files match exact Git blob hashes.'

      - name: Install dependencies and build exact approved source
        working-directory: /tmp/source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Replace recovery branch only after successful verification and build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/source/. .
          test "$(find . -path ./.git -prune -o -type f -print | wc -l | tr -d ' ')" = '52'
          while IFS=$'\t' read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected" || { echo "Final hash mismatch $path"; exit 1; }
          done < /tmp/manifest.tsv
          git add -A
          git commit -m 'Restaurar fuente exacta aprobada YoYoLetrasAI 3.6.0'
          git push origin HEAD:recovery/approved-3.6-exact
