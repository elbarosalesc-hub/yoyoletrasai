name: Generate virtual teacher migration

on:
  push:
    branches:
      - feat/virtual-teacher-history

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/virtual-teacher-history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate migration with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'supabase/migrations/*_add_virtual_teacher_history.sql' > /dev/null; then
            echo 'Migration already exists.'
            exit 0
          fi
          npx --yes supabase@latest migration new --help > /tmp/supabase-migration-help.txt
          npx --yes supabase@latest migration new add_virtual_teacher_history

      - name: Commit generated migration
        shell: bash
        run: |
          set -euo pipefail
          if git status --short -- supabase/migrations | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/migrations
            git commit -m "Generate Supabase migration for virtual teacher history"
            git push origin HEAD:feat/virtual-teacher-history
          fi
