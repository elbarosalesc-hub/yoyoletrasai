project_id = "yoyoletrasai"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
# Local development only. Preview/production redirect URLs must be configured
# explicitly in the hosted Supabase project after the real Cloudflare URL exists.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**"
]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "25MiB"
