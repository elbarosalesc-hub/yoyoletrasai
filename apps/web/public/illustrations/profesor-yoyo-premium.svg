<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Profesor virtual YOYO en aula interactiva</title>
  <desc id="desc">Aula luminosa con pizarra, robot profesor YOYO, biblioteca, plantas y elementos educativos.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf2ff"/><stop offset=".55" stop-color="#f9f7ff"/><stop offset="1" stop-color="#e9faf4"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d7b382"/><stop offset="1" stop-color="#b98959"/></linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#214e45"/><stop offset="1" stop-color="#123b36"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8f5cf2"/><stop offset="1" stop-color="#6136c8"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".55" stop-color="#dfe6f4"/><stop offset="1" stop-color="#bcc7dd"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2c195c"/><stop offset="1" stop-color="#6f3ede"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#cbb9ff" stop-opacity=".7"/><stop offset="1" stop-color="#cbb9ff" stop-opacity="0"/></radialGradient>
