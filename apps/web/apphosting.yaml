# Firebase App Hosting configuration for YoYoLetrasAI.
# Backend connection:
# - Repository: elbarosalesc-hub/yoyoletrasai
# - Live branch: main
# - App root directory: apps/web
#
# Configure NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY and
# SUPABASE_SERVICE_ROLE_KEY in Firebase App Hosting > Settings > Environment.
# Keep SUPABASE_SERVICE_ROLE_KEY in Google Cloud Secret Manager.

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://xpcywpvrveweynqvudcr.supabase.co
    availability:
      - BUILD
      - RUNTIME
