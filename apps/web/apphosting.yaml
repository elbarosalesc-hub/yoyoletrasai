# Firebase App Hosting configuration for YoYoLetrasAI.
# Backend settings:
# - GitHub repository: elbarosalesc-hub/yoyoletrasai
# - Live branch: main
# - Application root: apps/web
#
# Sensitive values must be configured in Firebase App Hosting / Secret Manager.
# Never commit SUPABASE_SERVICE_ROLE_KEY or private credentials.

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://xpcywpvrveweynqvudcr.supabase.co
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - RUNTIME
